name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-checks:
    name: Shell script checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate Bash syntax
        run: find linux/scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Lint Bash scripts
        run: shellcheck linux/scripts/*.sh
